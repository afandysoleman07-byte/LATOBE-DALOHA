<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-KOBAR TACTICAL | Red Alert Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root {
            --red-alert: #ff0000;
            --dark-steel: #0a0a0c;
            --metal-panel: #1a1a1e;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at center, #151c2c 0%, #080b11 100%);
            overflow-x: hidden;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .heavy-panel {
            background: linear-gradient(145deg, #16161a, #0f0f12);
            border: 2px solid #2a2a30;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .heavy-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 2px);
            pointer-events: none;
        }

        .industrial-border {
            border: 1px solid #3a3a40;
            box-shadow: 0 0 0 3px #1a1a1e, 0 0 0 4px #4a4a50;
        }

        .red-glow-text {
            color: var(--red-alert);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .scanner-line {
            height: 2px;
            background: rgba(255, 0, 0, 0.5);
            position: absolute;
            width: 100%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: scan 1s linear infinite;
            box-shadow: 0 0 15px var(--red-alert);
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .btn-tactical {
            background: linear-gradient(180deg, #303035 0%, #101015 100%);
            border: 1px solid #404045;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-tactical:active {
            transform: scale(0.95);
            background: #401010;
        }

        .hazard-stripe {
            background: repeating-linear-gradient(
                45deg,
                #facc15,
                #facc15 10px,
                #000 10px,
                #000 20px
            );
        }

        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        input, select, textarea {
            background: #050505 !important;
            border: 1px solid #333 !important;
            color: #ccc !important;
            font-family: 'JetBrains Mono', monospace;
        }

        input:focus, select:focus {
            border-color: var(--red-alert) !important;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2) !important;
        }
    </style>
</head>
<body class="text-slate-300 min-h-screen p-2 sm:p-6 selection:bg-red-600/30">
   
    <div class="w-full max-w-xl mx-auto">

        <!-- Top Frame Header -->
        <div class="relative bg-[#1a1a1e] border-x-4 border-t-4 border-[#3a3a40] p-4 rounded-t-3xl shadow-2xl">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-6">
                    <div class="status-led"></div>
                    <div>
                        <h1 class="text-xl font-black tracking-[0.3em] text-white">SI-KOBAR</h1>
                        <p class="text-[15px] text-slate-500 font-bold uppercase tracking-widest">DALOHA</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Body Panel -->
        <div class="heavy-panel border-4 border-[#3a3a40] rounded-b-3xl overflow-hidden shadow-2xl">
            
            <!-- Branding Section -->
            <div class="relative p-8 border-b-2 border-[#2a2a30] bg-[#0a0a0c]">
                <div class="scanner-line"></div>
                <div class="flex flex-col items-center">
                    <div class="mb-4 relative">
                        <div class="absolute -inset-4 bg-red-600/10 blur-xl rounded-full"></div>
                        <i class="fas fa-tower-broadcast text-5xl text-red-600 animate-bounce"></i>
                    </div>
                    <h2 class="text-4xl font-black text-white tracking-tighter uppercase italic">Lapas Tobelo</h2>
                    <div class="hazard-stripe h-1 w-48 mt-2 opacity-90"></div>
                    <p class="mt-3 text-[14px] text-red-500 font-black uppercase tracking-[0.5em]">Command & Control</p>
                </div>
            </div>

            <!-- Dashboard Data -->
            <div class="p-6 space-y-6 bg-black/40">
                
                <!-- Telemetry Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#050505] p-4 border border-[#2a2a30] rounded-lg text-center">
                        <p class="text-[12px] text-slate-600 font-bold uppercase mb-1">Time</p>
                        <p id="txt-jam" class="mono text-2xl text-red-600 font-black">00:00:00</p>
                    </div>
                    <div class="bg-[#050505] p-4 border border-[#2a2a30] rounded-lg text-center">
                        <p class="text-[12px] text-slate-600 font-bold uppercase mb-1">Calender ID</p>
                        <p id="txt-tgl" class="text-xs font-bold text-slate-400">-- --- ----</p>
                    </div>
                </div>

                <!-- GPS Tracker -->
                <div class="bg-red-950/10 border border-red-900/30 p-4 rounded-lg flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-red-600/20 rounded flex items-center justify-center border border-red-600/50">
                            <i class="fas fa-crosshairs text-red-500 text-lg"></i>
                        </div>
                        <div>
                            <p class="text-[12px] text-red-500 font-black uppercase">GPS LOCATION</p>
                            <p id="txt-lokasi" class="mono text-[11px] text-white">Awaiting Satellite Link...</p>
                        </div>
                    </div>
                    <i class="fas fa-satellite text-slate-700 animate-pulse"></i>
                </div>

                 <!-- Form Input -->
            <div class="space-y-4">
                <!-- Regu Pengamanan -->
                <div>
                    <label class="text-[12px] text-slate-400 ml-1 font-bold uppercase">Regu Pengamanan</label>
                    <div class="relative mt-1">
                        <select id="rupam" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pl-10 appearance-none focus:ring-2 focus:ring-red-600 outline-none">
                            <option value="RUPAM I">RUPAM I</option>
                            <option value="RUPAM II">RUPAM II</option>
                            <option value="RUPAM III">RUPAM III</option>
                            <option value="RUPAM IV">RUPAM IV</option>
                        </select>
                        <i class="fas fa-users absolute left-3 top-4 text-slate-500"></i>
                    </div>
                </div>

                <!-- Nama Petugas -->
                <div>
                    <label class="text-[12px] text-slate-400 ml-1 font-bold uppercase">Nama Petugas</label>
                    <div class="relative mt-1">
                        <input type="text" id="nama" placeholder="Ketik nama lengkap..." 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pl-10 focus:ring-2 focus:ring-red-600 outline-none transition">
                        <i class="fas fa-user-shield absolute left-3 top-4 text-slate-500"></i>
                    </div>
                </div>

                <!-- Brandgang Area -->
                <div>
                    <label class="text-[12px] text-slate-400 ml-1 font-bold uppercase">AREA KONTROL</label>
                    <div class="relative mt-1">
                        <select id="area" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pl-10 appearance-none focus:ring-2 focus:ring-red-600 outline-none">
                            <option value="KLINIK">KLINIK</option>
                            <option value="KANTIN">KANTIN</option>
                            <option value="BLOK ">BLOK MAPENALING</option>
                            <option value="BLOK HUNIAN">BLOK A</option>
                            <option value="BLOK HUNIAN">BLOK B</option>
                            <option value="BLOK HUNIAN">BLOK C</option>
                            <option value="BRANDGANG SELATAN">BLOK D</option>
                            <option value="BRANDGANG UTARA">BLOK WANITA</option>
                            <option value="BRANDGANG SELATAN">BRANDGANG SELATAN</option>
                            <option value="BRANDGANG UTARA">BRANDGANG UTARA</option>
                        </select>
                        <i class="fas fa-road absolute left-3 top-4 text-slate-500"></i>
                    </div>
                </div>
              
                <!-- Jumlah WBP -->
                <div>
                    <label class="text-[12px] text-slate-400 ml-1 font-bold uppercase">Jumlah WBP</label>
                    <textarea id="jumlah_wbp" rows="2" placeholder="Contoh: 150 ORANG KHUSUS BLOK HUNIAN" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:ring-2 focus:ring-red-600"></textarea>
                </div>

                <!-- Kondisi -->
                <div>
                    <label class="text-[12px] text-slate-400 ml-1 font-bold uppercase">Situasi Lapangan</label>
                    <textarea id="catatan" rows="2" placeholder="Contoh: Situasi Aman Kondusif / Situasi Tidak Aman" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:ring-2 focus:ring-red-600"></textarea>
                </div>
                    <!-- Tactical Cam -->
                    <div class="bg-[#080b11]/50 p-4 border border-dashed border-white/10 rounded-xl space-y-3">
                        <p class="text-xs font-bold text-white tracking-wide uppercase text-center">BUKA KAMERA</p>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-black/30 p-3 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
                                <button onclick="document.getElementById('fotoInput1').click()" class="w-10 h-10 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center justify-center shadow-lg">
                                    <i class="fas fa-camera text-sm"></i>
                                </button>
                                <img id="imgPreview1" class="hidden w-16 h-12 object-cover rounded mt-2 border border-red-500">
                                <p id="statusFoto1" class="text-[10px] text-slate-500 font-medium mt-1 uppercase">Foto 1</p>
                                <input type="file" id="fotoInput1" accept="image/*" capture="environment" class="hidden" onchange="previewFotoDua(event, 1)">
                            </div>

                            <div class="bg-black/30 p-3 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
                                <button onclick="document.getElementById('fotoInput2').click()" class="w-10 h-10 bg-slate-700 text-white rounded-lg hover:bg-slate-600 transition flex items-center justify-center shadow-lg">
                                    <i class="fas fa-camera text-sm"></i>
                                </button>
                                <img id="imgPreview2" class="hidden w-16 h-12 object-cover rounded mt-2 border border-red-500">
                                <p id="statusFoto2" class="text-[10px] text-slate-500 font-medium mt-1 uppercase">Foto 2</p>
                                <input type="file" id="fotoInput2" accept="image/*" capture="environment" class="hidden" onchange="previewFotoDua(event, 2)">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Strategic Actions -->
                <div class="grid grid-cols-2 gap-4 pt-4">
                    <button onclick="buatPDF()" class="btn-tactical text-white font-black py-5 rounded-xl border-b-4 border-slate-700 flex flex-col items-center">
                        <i class="fas fa-file-shield mb-1 text-xl"></i>
                        <span class="text-[12px]">CONVERT PDF</span>
                    </button>
                    
                    <button onclick="kirimWA()" class="bg-red-600 text-white font-black py-5 rounded-xl border-b-4 border-red-900 flex flex-col items-center hover:bg-red-500 transition shadow-xl shadow-red-950/50">
                        <i class="fas fa-signal-stream mb-1 text-xl"></i>
                        <span class="text-[12px]">KIRIM WHATSAPP</span>
                    </button>
                </div>
            </div>

            <!-- Security Footer -->
            <div class="bg-[#080b11]/80 p-3.5 text-center border-t border-white/5">
                <p class="mono text-[9px] text-slate-500 uppercase tracking-widest">Security Protocol // Latobe Tactical Systems</p>
            </div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        // UI Handlers untuk 2 Foto
        function previewFotoDua(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgEl = document.getElementById(`imgPreview${index}`);
                    const statusEl = document.getElementById(`statusFoto${index}`);
                    
                    imgEl.src = e.target.result;
                    imgEl.classList.remove('hidden');
                    
                    statusEl.innerText = `Foto ${index} Captured`;
                    statusEl.className = "text-[10px] text-red-400 font-semibold mt-1 uppercase";
                }
                reader.readAsDataURL(file);
            }
        }

        // Real-time Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('txt-jam').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('txt-tgl').innerText = now.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
        }, 1000);

        // GPS Engine
        let koordinat = "Lokasi belum didapat";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                koordinat = `${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('txt-lokasi').innerText = koordinat;
            }, (err) => {
                document.getElementById('txt-lokasi').innerText = "Aktifkan GPS Perangkat!";
            }, {enableHighAccuracy: true});
        }

        function kirimWA() {
            const nama = document.getElementById('nama').value;
            const rupam = document.getElementById('rupam').value;
            const area = document.getElementById('area').value;
            const jumlahWbp = document.getElementById('jumlah_wbp').value || "-";
            const catatan = document.getElementById('catatan').value || "STATUS: SECURE";
            const jam = document.getElementById('txt-jam').innerText;
            const tgl = document.getElementById('txt-tgl').innerText;
            const lokasi = document.getElementById('txt-lokasi').innerText;

            if(!nama) { alert("ERROR: INPUT OPERATOR ID!"); return; }

            const pesan = `*LAPORAN SI-KOBAR LATOBE*%0A` +
                          `------------------------------------%0A` +
                          `🛡️ *Regu Pengamanan :* ${rupam}%0A` +
                          `👤 *Nama Petugas :* ${nama}%0A` +
                          `📍 *Area Kontrol :* ${area}%0A` +
                          `👥 *Jumlah WBP :* ${jumlahWbp}%0A` +
                          `📅 *Tanggal :* ${tgl}%0A` +
                          `⏰ *Waktu :* ${jam}%0A` +
                          `🌎 *Titik GPS :* %0Ahttp://maps.google.com/?q=${lokasi}%0A` +
                          `------------------------------------%0A` +
                          `📝 *Kondisi :* ${catatan}%0A` +
                          `------------------------------------%0A` +
                          `_Dikirim melalui Sistem Digital Lapas Tobelo_`;

            const urlGrup = `https://api.whatsapp.com/send?text=${pesan}`;
            window.open(urlGrup, '_blank');
        }

        function buatPDF() {
            const nama = document.getElementById('nama').value;
            const rupam = document.getElementById('rupam').value;
            const area = document.getElementById('area').value;
            const jumlahWbp = document.getElementById('jumlah_wbp').value || "-";
            const catatan = document.getElementById('catatan').value || "AMAN TERKENDALI";
            const jam = document.getElementById('txt-jam').innerText;
            const tgl = document.getElementById('txt-tgl').innerText;
            const lokasi = document.getElementById('txt-lokasi').innerText;

            const namaKalapas = "DONNI ISA DERMAWAN,A.Md.IP.,S.H.M.Si"; 
            const nipKalapas = "198005162000121001";

            if (!nama) { 
                alert("ACCESS DENIED: Masukkan Nama Petugas untuk otentikasi PDF!"); 
                return; 
            }

            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            // --- 1. BACKGROUND & BORDER ---
            doc.setDrawColor(185, 28, 28);
            doc.setLineWidth(1);
            doc.rect(5, 5, pageWidth - 10, pageHeight - 10);
            doc.rect(7, 7, pageWidth - 14, pageHeight - 14);

            // --- 2. HEADER ---
            doc.setFillColor(15, 23, 42);
            doc.rect(7, 7, pageWidth - 14, 35, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("ATENSI PIMPINAN", pageWidth / 2, 21, { align: "center" });
            doc.setFontSize(13);
            doc.text("SISTEM KONTROL KELILING BARCODE LAPAS KELAS IIB TOBELO", pageWidth / 2, 31, { align: "center" });

            // --- 3. BODY DATA ---
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            let y = 55;
            const startX = 20;
            const colX = 70;

            const addRow = (label, value) => {
                doc.setFont("helvetica", "bold");
                doc.setFillColor(248, 250, 252);
                doc.rect(startX - 2, y - 5, 175, 8, 'F');
                doc.text(label.toUpperCase(), startX, y);
                doc.setFont("helvetica", "normal");
                doc.text(":  " + value, colX, y);
                y += 11;
            };

            addRow("Regu Pengamanan", rupam);
            addRow("Petugas Jaga", nama);
            addRow("Area Kontrol", area);
            addRow("Jumlah WBP", jumlahWbp);
            addRow("Waktu", jam);
            addRow("Tanggal Laporan", tgl);
            addRow("Koordinat GPS", lokasi);

            // --- 4. HASIL PANTAUAN ---
            y += 4;
            doc.setFont("helvetica", "bold");
            doc.setFillColor(185, 28, 28);
            doc.rect(startX - 2, y - 5, 45, 8, 'F');
            doc.setTextColor(255, 255, 255);
            doc.text("HASIL PANTAUAN", startX, y);

            y += 9;
            doc.setTextColor(30, 41, 59);
            doc.setFont("helvetica", "italic");
            const splitCatatan = doc.splitTextToSize(catatan, 160);
            doc.text(splitCatatan, startX, y);
            y += (splitCatatan.length * 7) + 10;

            // --- 5. LAMPIRAN FOTO (2 FOTO BERDAMPINGAN) ---
            const img1 = document.getElementById('imgPreview1');
            const img2 = document.getElementById('imgPreview2');
            const hasImg1 = img1 && !img1.classList.contains('hidden') && img1.src;
            const hasImg2 = img2 && !img2.classList.contains('hidden') && img2.src;

            if (hasImg1 || hasImg2) {
                try {
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(185, 28, 28);
                    doc.text("DOKUMENTASI", pageWidth / 2, y, { align: "center" });
                    y += 6;

                    const imgWidth = 75;  
                    const imgHeight = 55; 
                    const gap = 8;        

                    if (hasImg1 && hasImg2) {
                        const totalWidth = (imgWidth * 2) + gap;
                        const startXPhotos = (pageWidth - totalWidth) / 2;

                        doc.addImage(img1.src, 'JPEG', startXPhotos, y, imgWidth, imgHeight);
                        doc.addImage(img2.src, 'JPEG', startXPhotos + imgWidth + gap, y, imgWidth, imgHeight);
                    } else if (hasImg1) {
                        const imgX = (pageWidth - imgWidth) / 2;
                        doc.addImage(img1.src, 'JPEG', imgX, y, imgWidth, imgHeight);
                    } else if (hasImg2) {
                        const imgX = (pageWidth - imgWidth) / 2;
                        doc.addImage(img2.src, 'JPEG', imgX, y, imgWidth, imgHeight);
                    }

                    y += imgHeight + 12; 
                } catch (e) {
                    console.error("Gagal menambahkan gambar ke PDF:", e);
                }
            } else {
                doc.setFontSize(9);
                doc.setTextColor(148, 163, 184);
                doc.text("* Tidak ada lampiran bukti foto.", pageWidth / 2, y, { align: "center" });
                y += 15;
            }

            // Tanda tangan dinamis
            let signY = y;
            if (signY > pageHeight - 60) { 
                doc.addPage();
                signY = 30;
                doc.setDrawColor(185, 28, 28);
                doc.setLineWidth(1);
                doc.rect(5, 5, pageWidth - 10, pageHeight - 10);
                doc.rect(7, 7, pageWidth - 14, pageHeight - 14);
            }

            const signX = pageWidth - 90; 
            doc.setTextColor(15, 23, 42);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Mengetahui,", signX, signY);
            signY += 5;
            doc.text("Kepala Lapas Tobelo,", signX, signY);

            signY += 25; 
            doc.setFont("helvetica", "bold");
            doc.text(namaKalapas, signX, signY);

            doc.setLineWidth(0.5);
            doc.setDrawColor(15, 23, 42);
            doc.line(signX, signY + 1, signX + 65, signY + 1);
    
            signY += 6;
            doc.setFont("helvetica", "normal");
            doc.text("NIP. " + nipKalapas, signX, signY);

            // --- 6. FOOTER ---
            doc.setFontSize(8);
            doc.setTextColor(148, 163, 184);
            doc.text("Digital Signature: SI-KOBAR-DALOHA-TACTICAL-SYSTEM", pageWidth / 2, pageHeight - 15, { align: "center" });

            const cleanName = nama.replace(/\s+/g, '_').toUpperCase();
            doc.save(`LAPORAN_OPS_${cleanName}.pdf`);
        }
    </script>
</body>
</html>
